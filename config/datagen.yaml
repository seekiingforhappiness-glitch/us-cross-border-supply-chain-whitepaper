# W2 数据生成配置（AGENTS.md §7：参数一律进配置，禁止硬编码）
seed: 42

window:
  start: "2026-05-01"
  end: "2026-08-31"
  as_of: "2026-08-08"          # D8 固定快照日；oracle 与引擎评估均以此为准

buffers:                        # R1 缓冲（plan §8）
  customs_days: 3
  lastmile_days: 2

risk:
  stall_days: 5                 # R3
  docs_window_days: 7           # R2

counts:                         # plan §9 规模
  suppliers: 10
  skus: 20
  customers: 15
  sales_orders: 300
  purchase_orders: 250
  shipments: 120

world:
  lines_per_so_weights: {1: 0.30, 2: 0.25, 3: 0.20, 4: 0.15, 5: 0.10}
  qty_range: [50, 2000]
  promise_offset_days: [35, 60]     # promise = order_date + offset
  transit_days: [13, 17]            # 海运
  pos_per_shipment: [1, 4]
  docs_missing_rate: 0.10           # 世界真实状态（非噪声），进 expected_risk_events
  delay_days_per_change: [4, 12]
  multi_customer_breach_min: 15   # plan §9：一票延误击穿多客户 ≥15，确定性补齐
  transshipment_rate: 0.40

noise_rates:                    # 数据质量噪声（进 injected_noise_log，不产生风险）
  eta_multi_change: 0.30        # ≥1 次 ETA 变更的 shipment 占比
  eta_change_3plus: 0.10        # ≥3 次
  milestone_duplicate: 0.05
  milestone_out_of_order: 0.05
  status_conflict: 0.08
  null_vessel_carrier: 0.10
  supplier_name_variant: 0.20
  # v0.6 专题二 H3：milestone 单证号形态（作用于非设计船行）
  doc_ref_container_only: 0.10  # 只有 container_no（booking 留空）
  doc_ref_booking_only: 0.05    # 只有 booking_no（柜号留空）；其余 85% 两者齐备
  doc_ref_typo: 0.02            # 坏单证号：booking 末位篡改 + 柜号置空 → 必然不可解析

cost:                           # v0.4 费用闭环（X2）参数
  rate_tolerance: 0.05          # R4 费率超收容差（>基准×1.05 判超收）
  unplanned_high_threshold_usd: 500  # R6 计划外费用 high 门槛
  detention_daily_usd: 150      # DET 滞箱费日费率
  overbilling_rate: 0.08        # 随机超收注入比例（→R4）
  duplicate_rate: 0.04          # 随机重复计费注入比例（→R5）

procurement:                    # P1 采购三方对账（Build 1/3）——独立随机流 seed+4000
  seed_offset: 4000             # 独立随机流偏移（既有数据零扰动，§7 可复现）
  lines_per_po_weights: {1: 0.40, 2: 0.35, 3: 0.25}
  qty_range: [500, 5000]
  ready_window: ["2026-05-21", "2026-07-15"]  # po_line.expected_ready_date 取样窗口
  receipt_delay_tol_days: 3     # R7：received_date > expected_ready_date + 容差 → 供应商交期延误
  short_qty_tol: 0.03           # R8：accepted/received_qty < po_line.qty×(1−容差) → 短装
  defect_ppm_threshold: 3000    # R9：defect_ppm > 阈值 或 qc_status=failed → QC 不合格
  price_tol: 0.02               # R10：|inv 单价 − po 单价|/po 单价 > 容差 → 价量不符
  partial_receipt_rate: 0.40    # clean/gray 内分批收货（2 张 GRN）比例——演示分批
  # 采购富化 R11-R13（决策日志 P2）容差/阈值
  invoice_over_qty_tol: 0.02    # R11：发票行 qty > 实收 received×(1+容差) 且该行足量收货（received≥
                                #   ordered×(1−short_qty_tol)，非短装 R8 域）→ 开票超收货量。
                                #   与 short_qty_tol=0.03 构成 [0.02,0.03] 注入带：注入超收 2.5% 恰落带内
                                #   （> 2% 触发 R11，< 3% 不触发 R8/不触 R10 数量分支）。
  deposit_ratio: 0.30           # 预付定金占 PO 行额比例（PurchasePayment.amount_usd 基准）
  deposit_grace_days: 30        # R12：deposit 已付且 PO 无收货、超此宽限天数 → 敞口 at_risk
  exposure_high_usd: 30000      # R12：敞口(定金)金额 > 此值 → high，否则 medium
  qual_expiring_days: 30        # R13：valid_to 落在 as_of..as_of+此天数 → expiring（灰区，未过期不算）
  inject:                       # 注入画像计数（固定，可复现；verify 精确断言）
    clean: 12                   # 全干净（准时/足量/QC 合格/价量相符）→ 不进真值
    gray: 9                     # 灰区（各维度容差内波动）→ 不进真值（测未来误报）
    r7: 8                       # 供应商交期延误
    r8: 8                       # 短装
    r9: 7                       # QC 不合格
    r10: 8                      # 价量不符
    # ↓ 采购富化 P2 append-only 新桶（既有 6 桶计数/顺序不变 → R7-R10 数据字节不变；
    #   新桶在 selected 排序前缀之后，rng 在既有 52 PO 之后才抽 → 既有逐字节零扰动）
    r11: 7                      # 开票超收货量（足量收货但发票数量超收）
    r11_gray: 2                # 灰区：发票数量在容差内略超（不触发）
    r12: 7                      # 预付款敞口（deposit 已付、PO 无收货、超宽限）
    r12_gray: 2                # 灰区：deposit 已付但仍在宽限期内（不触发）
  qual_inject:                  # 供应商资质注入（supplier 级，非 PO 桶）；R13 锚 supplier_id
    r13: 5                      # 资质过期(valid_to<as_of，无同类续证) + 供应商仍有 open PO
    r13_gray: 1                # 灰区：资质过期但已续期（同类新证覆盖 as_of）→ 不触发
    r13_expiring: 1            # 灰区：资质临期（valid_to 在 as_of..+expiring_days）→ 未过期不触发

warehouse:                      # W1 仓储库存准确主线（Build 1/3）——独立随机流 seed+5000
  seed_offset: 5000             # 独立随机流偏移（既有数据零扰动，§7 可复现）
  safety_stock_range: [80, 300] # InventoryPosition.safety_stock 取样范围（SKU×仓库）
  ira_target: 0.98              # 库存记录准确率(IRA)目标：IRA = 1 − |counted−system|/system
  cycle_count_tol: 0.02         # R18：|counted−system|/system > 容差 → 盘点差异（等价 IRA<0.98）
  stockout_high_frac: 0.5       # R16：available ≤ safety×此比例 → high，否则 medium
  shrink_high_ratio: 0.05       # R18：|var|/system > 此比例 → high，否则 medium（仍须 > tol）
  inject:                       # 注入画像计数（固定，可复现；verify 精确断言）
    clean: 24                   # 全健康 position（available≫safety、ATP≫需求、盘点吻合）→ 不进真值
    r16: 6                      # 断货：available ≤ safety_stock
    r16_gray: 2                # 灰区：available = safety+δ（略高于安全库存）→ 不触发
    r17: 6                      # 不可履约：open SOL 的 sku 在目的仓 ATP < 需求量
    r17_gray: 2                # 灰区：ATP ≥ 需求（恰好够）→ 不触发
    r18: 6                      # 盘点差异：|counted−system|/system > 容差
    r18_gray: 2                # 灰区：|counted−system|/system ≤ 容差 → 不触发
  clean_reservations: 8         # 干净预留（status=allocated/fulfilled，不进 R17 域）演示用
  clean_cycle_counts: 6         # 干净盘点（counted=system，reconciled）演示用

sourcing:                       # P3 采购富化2：RFQ 询价 + R14 单一来源 + R15 maverick——独立随机流 seed+6000
  seed_offset: 6000             # 独立随机流偏移（既有数据零扰动，§7 可复现）
  single_source_recent_days: 90 # R14：仅计 detected_at 落 [as_of-N, as_of] 的 R7/R9 事件（近期断供窗口）
  single_source_high_usd: 100000 # R14：单一来源敞口(该 SKU 的 PO 采购额) > 此值 → high，否则 medium
  maverick_high_usd: 100000     # R15：绕流程发票额 > 此值 → high，否则 medium
  inject:                       # 注入画像计数（固定，可复现；verify 精确断言）
    r14: 4                       # 单一来源(仅 1 个 approved 供应商) 且该供应商近期有 R7/R9 → 断供风险
    r14_gray: 3                  # 灰区：单一来源但供应商无近期 R7/R9（健康）→ 不触发
    r14_inflight: 2              # 在建 RFQ（未 awarded）——第二来源在途，目标仍单源（不改 R14 判定）
    clean_multi_source: 3        # 干净：2+ approved 供应商（已 awarded 历史询价建立备源）→ 不触发
    r15: 4                       # 绕流程采购：发票供应商≠PO 供应商 且非该 SKU 的 approved 备源
    r15_gray: 1                  # 灰区：发票供应商≠PO 供应商 但为该 SKU approved 备源 → 豁免（不触发）

scoring:                        # v0.6 专题一 Y1 风险评分模型（H1/H2）
  split_ratio: 0.7              # 按 shipment_id 的 sha256 十六进制排序取前 70% 训练
  lr: 0.5                       # 全批量梯度下降步长
  epochs: 3000                  # 迭代轮数
  auc_gate_early: 0.7           # 组 B（早警）测试集 AUC 硬门（H1 唯一硬门）

mdm:                            # M4 simulated crosswalk，不接企业 MDM
  updated_at: "2026-08-08T00:00:00Z"
  ambiguous_sku_external_id: "ERP-SKU-AMBIG-USB-C-20W"
  unresolved_vendor_external_id: "VENDOR-404"

demo_ops:                       # enrich demo 运营快照种子（datagen.seed_demo_ops）——只写 tasks/action_log
  seed: 20260808                # 固定随机种子，可复现（§7）
  n_control_tower: 14           # R1-R3 派给 ops/cs/CN 的任务数
  n_cost: 6                     # R4-R6 派给 finance 的任务数

output:
  raw_dir: "data/raw"
  truth_dir: "data/truth"       # 仅 datagen/verify 与 W4 评估可读；pipeline/engine 禁读
