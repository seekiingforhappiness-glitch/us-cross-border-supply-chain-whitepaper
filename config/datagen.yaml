# W2 数据生成配置（AGENTS.md §7：参数一律进配置，禁止硬编码）
seed: 42

window:
  start: "2026-05-01"
  end: "2026-08-31"
  as_of: "2026-08-08"          # D8 固定快照日；oracle 与引擎评估均以此为准

buffers:                        # R1 缓冲（plan §8）
  customs_days: 3
  lastmile_days: 2

risk:
  stall_days: 5                 # R3
  docs_window_days: 7           # R2

counts:                         # plan §9 规模
  suppliers: 10
  skus: 20
  customers: 15
  sales_orders: 300
  purchase_orders: 250
  shipments: 120

world:
  lines_per_so_weights: {1: 0.30, 2: 0.25, 3: 0.20, 4: 0.15, 5: 0.10}
  qty_range: [50, 2000]
  promise_offset_days: [35, 60]     # promise = order_date + offset
  transit_days: [13, 17]            # 海运
  pos_per_shipment: [1, 4]
  docs_missing_rate: 0.10           # 世界真实状态（非噪声），进 expected_risk_events
  delay_days_per_change: [4, 12]
  multi_customer_breach_min: 15   # plan §9：一票延误击穿多客户 ≥15，确定性补齐
  transshipment_rate: 0.40

noise_rates:                    # 数据质量噪声（进 injected_noise_log，不产生风险）
  eta_multi_change: 0.30        # ≥1 次 ETA 变更的 shipment 占比
  eta_change_3plus: 0.10        # ≥3 次
  milestone_duplicate: 0.05
  milestone_out_of_order: 0.05
  status_conflict: 0.08
  null_vessel_carrier: 0.10
  supplier_name_variant: 0.20
  # v0.6 专题二 H3：milestone 单证号形态（作用于非设计船行）
  doc_ref_container_only: 0.10  # 只有 container_no（booking 留空）
  doc_ref_booking_only: 0.05    # 只有 booking_no（柜号留空）；其余 85% 两者齐备
  doc_ref_typo: 0.02            # 坏单证号：booking 末位篡改 + 柜号置空 → 必然不可解析

cost:                           # v0.4 费用闭环（X2）参数
  rate_tolerance: 0.05          # R4 费率超收容差（>基准×1.05 判超收）
  unplanned_high_threshold_usd: 500  # R6 计划外费用 high 门槛
  detention_daily_usd: 150      # DET 滞箱费日费率
  overbilling_rate: 0.08        # 随机超收注入比例（→R4）
  duplicate_rate: 0.04          # 随机重复计费注入比例（→R5）

procurement:                    # P1 采购三方对账（Build 1/3）——独立随机流 seed+4000
  seed_offset: 4000             # 独立随机流偏移（既有数据零扰动，§7 可复现）
  lines_per_po_weights: {1: 0.40, 2: 0.35, 3: 0.25}
  qty_range: [500, 5000]
  ready_window: ["2026-05-21", "2026-07-15"]  # po_line.expected_ready_date 取样窗口
  receipt_delay_tol_days: 3     # R7：received_date > expected_ready_date + 容差 → 供应商交期延误
  short_qty_tol: 0.03           # R8：accepted/received_qty < po_line.qty×(1−容差) → 短装
  defect_ppm_threshold: 3000    # R9：defect_ppm > 阈值 或 qc_status=failed → QC 不合格
  price_tol: 0.02               # R10：|inv 单价 − po 单价|/po 单价 > 容差 → 价量不符
  partial_receipt_rate: 0.40    # clean/gray 内分批收货（2 张 GRN）比例——演示分批
  inject:                       # 注入画像计数（固定，可复现；verify 精确断言）；n_pos=Σ=52
    clean: 12                   # 全干净（准时/足量/QC 合格/价量相符）→ 不进真值
    gray: 9                     # 灰区（各维度容差内波动）→ 不进真值（测未来误报）
    r7: 8                       # 供应商交期延误
    r8: 8                       # 短装
    r9: 7                       # QC 不合格
    r10: 8                      # 价量不符

scoring:                        # v0.6 专题一 Y1 风险评分模型（H1/H2）
  split_ratio: 0.7              # 按 shipment_id 的 sha256 十六进制排序取前 70% 训练
  lr: 0.5                       # 全批量梯度下降步长
  epochs: 3000                  # 迭代轮数
  auc_gate_early: 0.7           # 组 B（早警）测试集 AUC 硬门（H1 唯一硬门）

mdm:                            # M4 simulated crosswalk，不接企业 MDM
  updated_at: "2026-08-08T00:00:00Z"
  ambiguous_sku_external_id: "ERP-SKU-AMBIG-USB-C-20W"
  unresolved_vendor_external_id: "VENDOR-404"

demo_ops:                       # enrich demo 运营快照种子（datagen.seed_demo_ops）——只写 tasks/action_log
  seed: 20260808                # 固定随机种子，可复现（§7）
  n_control_tower: 14           # R1-R3 派给 ops/cs/CN 的任务数
  n_cost: 6                     # R4-R6 派给 finance 的任务数

output:
  raw_dir: "data/raw"
  truth_dir: "data/truth"       # 仅 datagen/verify 与 W4 评估可读；pipeline/engine 禁读
